[project]
name = "agentic-trading"
version = "0.1.0"
description = "Agentig trading project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars>=4.13.2",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.5.260730",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "quantcore",
    "scipy>=1.18.1",
    "streamlit>=1.62.0",
    "typer>=0.27.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[project.scripts]
agentic-trading = "agentic_trading.main:main"
agentic-trading-cli = "agentic_trading.cli:main"
agentic-trading-experiment = "agentic_trading.cli:experiment_main"
agentic-trading-stage-a = "agentic_trading.cli:stage_a_main"
agentic-trading-firm-record = "agentic_trading.cli:firm_record_main"

[tool.uv.sources]
quantcore = { git = "https://github.com/hampustalhandske/quantcore.git", rev = "599b8bd339898cbbafd07c128b36791d4072d811" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "duckdb>=1.5.5,<2",
    "ijson>=3.5.1",
    "jsonschema==4.26.0",
    "matplotlib>=3.11.2",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/agentic_trading/data/lakehouse_client.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # Ruff-specific rules
]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "determinism: reruns, resumes or parallelizes a pipeline and requires bit-identical output (part of the default suite; select with -m determinism)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
module = "agentic_trading.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["quantcore.*", "scipy.*", "exchange_calendars.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "agentic_trading.data.lakehouse_client"
ignore_errors = true
